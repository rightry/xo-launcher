<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    #stage { width: 100%; height: 100%; }
    #hint {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #9a9a9a; font: 13px/1.4 "Microsoft YaHei UI", sans-serif; text-align: center; padding: 16px;
    }
  </style>
</head>
<body>
  <div id="hint">正在加载 3D 皮肤…</div>
  <canvas id="stage"></canvas>
  <script type="module">
    const hint = document.getElementById("hint");
    const canvas = document.getElementById("stage");
    let viewer = null;

    async function boot() {
      try {
        const { SkinViewer } = await import("https://cdn.jsdelivr.net/npm/skinview3d@3.3.0/+esm");
        viewer = new SkinViewer({
          canvas,
          width: canvas.clientWidth || 280,
          height: canvas.clientHeight || 360,
          preserveDrawingBuffer: true
        });
        viewer.autoRotate = true;
        viewer.autoRotateSpeed = 0.6;
        viewer.zoom = 0.85;
        hint.style.display = "none";
        window._skinReady = true;
        if (window._pendingSkin) {
          await window.setSkin(window._pendingSkin.url, window._pendingSkin.slim);
          window._pendingSkin = null;
        }
      } catch (e) {
        hint.textContent = "无法加载 3D 引擎。请检查网络后重试。";
      }
    }

    window.setSkin = async function (url, slim) {
      if (!viewer) {
        window._pendingSkin = { url, slim };
        return;
      }
      try {
        await viewer.loadSkin(url, { model: slim ? "slim" : "default" });
        hint.style.display = "none";
      } catch (e) {
        hint.textContent = "皮肤贴图无法解析。";
        hint.style.display = "flex";
      }
    };

    window.addEventListener("resize", () => {
      if (!viewer) return;
      viewer.width = canvas.clientWidth;
      viewer.height = canvas.clientHeight;
    });

    boot();
  </script>
</body>
</html>
